version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - errorlint
    - bodyclose
    - copyloopvar
    - durationcheck
    - nilerr
    - predeclared
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
